[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-knowledge-api"
version = "0.1.0"
description = "Durable API for the agentic knowledge workspace"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "numpy>=1.26,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "openai>=1.55,<3",
  "pypdf>=5,<7",
  "duckdb>=1.2,<2",
  "cryptography>=42,<46",
  # argon2id password hashing, with the library's own constant-time verify.
  "argon2-cffi>=23,<26",
  "garminconnect>=0.2.8,<0.3",
  "mcp>=1.2,<2",
  # Type-checks compiled workflow node arguments against each tool's published
  # JSON Schema (ADR 0007). Already in the tree via `mcp`; declared because
  # services/workflows/validate.py imports it directly, and a direct import
  # riding on someone else's transitive dependency is a break waiting to happen.
  "jsonschema>=4.20,<5",
  # Hosted microVMs for server-side code execution (ADR 0005). Imported only by
  # services/sandbox/e2b_provider.py, and only when SANDBOX_PROVIDER=e2b.
  "e2b-code-interpreter>=2.9,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-jsonschema>=4.20,<5"
]
postgres = [
  "psycopg[binary]>=3.2,<4"
]
mysql = [
  "pymysql>=1.1,<2"
]
duckdb = [
  "duckdb-engine>=0.13,<1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "latex: requires jasmine-latex Docker image (make latex-image)",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP006", "UP035", "UP045"]

[tool.mypy]
python_version = "3.10"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = true
