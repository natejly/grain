[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-knowledge-api"
version = "0.1.0"
description = "Durable API for the agentic knowledge workspace"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "openai>=1.55,<3",
  "pypdf>=5,<7",
  "duckdb>=1.2,<2",
  "cryptography>=42,<46",
  "garminconnect>=0.2.8,<0.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2"
]
postgres = [
  "psycopg[binary]>=3.2,<4"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP006", "UP035", "UP045"]

[tool.mypy]
python_version = "3.9"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = true
